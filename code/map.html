<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Non-overlapping image locations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map { height: 100vh; width: 100%; }
  .info-box {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 10px 14px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px; max-width: 260px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="info-box"><b>2</b> non-overlapping image locations</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const points = [{"image_name": "20221016_436_Flight_01_00653.JPG", "latitude": 29.264245679012703, "longitude": 48.05565865377481, "altitude": 333.251665}, {"image_name": "20221016_436_Flight_01_00654.JPG", "latitude": 29.264133338276697, "longitude": 48.055157922634216, "altitude": 332.2080924}];

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 22,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const latlngs = points.map(p => [p.latitude, p.longitude]);
  const bounds = L.latLngBounds(latlngs);

  points.forEach((p, i) => {
    L.circleMarker([p.latitude, p.longitude], {
      radius: 6, color: '#1d4ed8', fillColor: '#3b82f6', fillOpacity: 0.85, weight: 1.5
    })
    .bindPopup(`<b>${p.image_name}</b><br>lat: ${p.latitude.toFixed(6)}<br>lon: ${p.longitude.toFixed(6)}<br>alt: ${p.altitude.toFixed(1)} m`)
    .addTo(map);
  });

  L.polyline(latlngs, { color: '#93c5fd', weight: 2, opacity: 0.6, dashArray: '4 4' }).addTo(map);

  map.fitBounds(bounds, { padding: [40, 40] });
</script>
</body>
</html>
